version: '3'

tasks:
  build:frontend:
    desc: Build frontend assets
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile --ignore-scripts
      - pnpm run build

  build:backend:
    desc: Build backend binary
    cmds:
      - go build -ldflags='-s -w -X "github.com/rforced/filebrowser/v2/version.Version={{.VERSION}}" -X "github.com/rforced/filebrowser/v2/version.CommitSHA={{.GIT_COMMIT}}"' -o filebrowser .
    vars:
      GIT_COMMIT:
        sh: git log -n 1 --format=%h
      VERSION:
        sh: git describe --tags --abbrev=0 --match=v* | cut -c 2-

  build:
    desc: Build both frontend and backend
    cmds:
      - task: build:frontend
      - task: build:backend

  release:make:
    internal: true
    prompt: Do you wish to proceed?
    cmds:
      - pnpm dlx commit-and-tag-version@13.1.2 -s

  release:dry-run:
    internal: true
    cmds:
      - pnpm dlx commit-and-tag-version@13.1.2 --dry-run --skip

  release:
    desc: Create a new release
    cmds:
      - task: release:dry-run
      - task: release:make
