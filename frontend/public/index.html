<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400..800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://kit.fontawesome.com/15eb3be31d.css"
      crossorigin="anonymous"
    />

    <title>
      [{[ if .Name -]}][{[ .Name ]}][{[ else ]}]File Browser[{[ end ]}]
    </title>

    <meta name="robots" content="noindex,nofollow" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="[{[ .StaticURL ]}]/img/icons/favicon.svg"
    />
    <link rel="shortcut icon" href="[{[ .StaticURL ]}]/img/icons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="[{[ .StaticURL ]}]/img/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="File Browser" />

    <!-- Add to home screen for Android and modern mobile browsers -->
    <link
      rel="manifest"
      id="manifestPlaceholder"
      crossorigin="use-credentials"
    />
    <meta
      name="theme-color"
      content="[{[ if .Color -]}][{[ .Color ]}][{[ else ]}]#225885[{[ end ]}]"
    />

    <script nonce="[{[ .Nonce ]}]">
      window.FileBrowser = [{[ .Json ]}];
      window.FileBrowser.Nonce = "[{[ .Nonce ]}]";

      if (window.FileBrowser.CSS) {
        var cl = document.createElement('link');
        cl.rel = 'stylesheet';
        cl.href = window.FileBrowser.StaticURL + '/custom.css';
        document.head.appendChild(cl);
      }
      // Global function to prepend static url
      window.__prependStaticUrl = (url) => {
        return `${window.FileBrowser.StaticURL}/${url.replace(/^\/+/, "")}`;
      };
      var dynamicManifest = {
        name: window.FileBrowser.Name || "File Browser",
        short_name: window.FileBrowser.Name || "File Browser",
        icons: [
          {
            src:
              window.location.origin +
              window.__prependStaticUrl("/img/icons/android-chrome-192x192.png"),
            sizes: "192x192",
            type: "image/png",
          },
          {
            src:
              window.location.origin +
              window.__prependStaticUrl("/img/icons/android-chrome-512x512.png"),
            sizes: "512x512",
            type: "image/png",
          },
        ],
        start_url: window.location.origin + window.FileBrowser.BaseURL,
        display: "standalone",
        background_color: "#ffffff",
        theme_color: window.FileBrowser.Color || "#225885",
      };

      const stringManifest = JSON.stringify(dynamicManifest);
      const blob = new Blob([stringManifest], { type: "application/json" });
      const manifestURL = URL.createObjectURL(blob);
      document
        .querySelector("#manifestPlaceholder")
        .setAttribute("href", manifestURL);
    </script>

    <script nonce="[{[ .Nonce ]}]">
      (function () {
        var stored = localStorage.getItem("color-theme-preference");
        var preference =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : window.FileBrowser.Theme === "light" ||
                window.FileBrowser.Theme === "dark"
              ? window.FileBrowser.Theme
              : "system";
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        var isDark =
          preference === "dark" || (preference === "system" && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
        localStorage.setItem("color-theme", isDark ? "dark" : "light");
      })();
    </script>

    <style>
      /*
        Inline so it applies before the bundle's stylesheet arrives. Kept in sync
        with the #loading rules in src/css/app.css, which take over afterwards.
      */
      #loading {
        position: fixed;
        inset: 0;
        background: #f9fafb;
        z-index: 9999;
        transition: 0.1s ease opacity;
      }

      html.dark #loading {
        background: #111827;
      }

      #loading.done {
        opacity: 0;
      }

      #loading .spinner {
        width: 70px;
        text-align: center;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #loading .spinner > div {
        width: 18px;
        height: 18px;
        background-color: #225885;
        border-radius: 100%;
        display: inline-block;
        animation: sk-bouncedelay 1.4s infinite ease-in-out both;
      }

      html.dark #loading .spinner > div {
        background-color: #88ddef;
      }

      #loading .spinner .bounce1 {
        animation-delay: -0.32s;
      }

      #loading .spinner .bounce2 {
        animation-delay: -0.16s;
      }

      @keyframes sk-bouncedelay {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="loading">
      <div class="spinner">
        <div class="bounce1"></div>
        <div class="bounce2"></div>
        <div class="bounce3"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
